<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Float Goat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Pacifico&family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Float Goat</h1>
      <p class="instructions">
        Move your hands in front of the camera to keep the ball in the air!
      </p>

      <!-- Low-end device warning (hidden by default) -->
      <div id="perfWarning" class="perf-warning hidden">
        Your device may be too slow for smooth hand tracking. Desktop is recommended.
      </div>

      <div class="canvas-wrapper">
        <!-- Hidden video element for webcam -->
        <video id="webcam" autoplay playsinline></video>

        <!-- Game canvas -->
       <canvas id="gameCanvas" width="640" height="480" style="display:block; width:100%; height:100%;"></canvas>

        <!-- Game state overlay -->
        <div id="overlay" class="overlay">
          <h2 id="overlayMessage">Ready to Play?</h2>
          <button id="startButton">Start Game</button>
        </div>
      </div>

      <!-- Score display -->
      <div id="scoreDisplay">
        <p>Time: <span id="score">0</span>s</p>
      </div>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
      <div class="loading-content">
        <div class="loader"></div>
        <h2>Lifting off...</h2>
        <p id="loadingStatus">Hands Ready...</p>
      </div>
    </div>

    <!-- Load TensorFlow.js and MediaPipe Hands (pinned versions) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.1/dist/hand-pose-detection.min.js" crossorigin="anonymous"></script>

    <!-- Load game modules -->
    <script src="handTracking.js"></script>
    <script src="game.js"></script>
  </body>
</html>
